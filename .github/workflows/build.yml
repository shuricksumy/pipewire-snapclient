name: Build_Push_Scan

permissions:
  contents: read
  pull-requests: write
  packages: write  # Required for pushing to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '*.md'
      # Not part of the image (see .dockerignore) - editing them should not republish it
      - 'docker-compose*.yaml'
      - 'docker-compose*.yml'
      - 'JBL-fix.sh'
      - 'ubuntu-pipewire-install-on-host.sh'
  release:
    types: [published]
  # Rebuild weekly so Debian security updates reach the published image even when
  # there are no commits (paths-ignore above only applies to push events).
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Manual tag name (defaults to latest if empty)'
        required: false
        default: 'latest'

# --- Force the runner to use Node 24 for all actions ---
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The panel's supervisor and API, against a fake snapclient and a fake
  # snapserver -- no PipeWire, no DAC, no root, so it runs on a plain runner.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'

      - name: Install test dependencies
        run: pip install flask pytest

      - name: Run the panel test suite
        run: python -m pytest tests/ -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Snapcast .deb packages are pulled from the upstream release at build
      # time. Resolving the tag here (authenticated) keeps the in-build API call
      # off the anonymous rate limit and makes the version visible in the build
      # log. REFRESH_WEEK changes every ISO week so the scheduled rebuild re-runs
      # apt instead of restoring a stale layer from the GHA cache.
      - name: Resolve build inputs
        id: inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          snapcast="$(gh api repos/snapcast/snapcast/releases/latest --jq .tag_name)"
          week="$(date -u +%G-W%V)"
          echo "snapcast_version=$snapcast" >> "$GITHUB_OUTPUT"
          echo "refresh_week=$week" >> "$GITHUB_OUTPUT"
          echo "Snapcast $snapcast | cache epoch $week"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/snapcast-pipewire
          tags: |
            # Tag 'latest' only on the main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag with the branch name (e.g., :main)
            type=ref,event=branch
            # Tag with the release version if applicable
            type=semver,pattern={{version}}
            # Handle manual workflow dispatch tag
            type=raw,value=${{ github.event.inputs.tag_name }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and Push Docker Image
        # Updated to v6 for Node 24 support
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SNAPCAST_VERSION=${{ steps.inputs.outputs.snapcast_version }}
            REFRESH_WEEK=${{ steps.inputs.outputs.refresh_week }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Published builds (weekly, release, manual) start from scratch, so a
          # stale layer can never reach a release; ordinary pushes and PRs keep
          # the cache for speed. cache-to still refreshes it either way.
          no-cache: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    # This workflow is named "Build_Push_Scan" but had no scan step -- same gap found and fixed
    # in the sibling ledfx-snapcast-docker and pipewire-squeezelite repos. Scans the pushed GHCR
    # image itself (base Debian packages, the vendored snapclient/snapserver .deb files), not
    # just source -- there's no Python/JS/etc. source here for CodeQL to analyze (Shell isn't a
    # supported CodeQL language), so a container scan is the only applicable form of scanning for
    # this repo.
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/snapcast-pipewire:${{ needs.build-and-push.outputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Debian carries a large backlog of CVEs it has not patched; reporting them
          # buries the ones we can actually act on (a rebuild picks up the fix).
          # Only alert on vulnerabilities that have a fixed version available.
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: trivy-results.sarif
