name: GHCR package cleanup

# Same reasoning as pipewire-squeezelite's copy of this workflow: docker/metadata-action here
# never produces a per-push sha tag -- only `latest` and `main`, both repointed (not appended)
# on every push. That still orphans the *old* digest each one used to point to, so this sweeps
# up those orphaned multi-arch layers, and is ready for a semver release tag if one is ever cut
# (metadata-action already has type=semver configured).
#
# The 2026-07-22 dry run was reviewed before enabling real deletion: 45 images / 9 multi-arch
# parents, all of them orphaned digests. `latest`+`main` are the only tagged version in the
# package and both are excluded below. Monthly is plenty -- one orphan set accumulates per push.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 5 1 * *'

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old ghcr.io package versions
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: shuricksumy
          # Published as ghcr.io/shuricksumy/snapcast-pipewire -- build.yml's metadata images
          # field is repository_owner-scoped, not the repo name.
          package: "snapcast-pipewire"
          # Keep `latest`, `main`, and any future semver release tag; delete everything else plus
          # orphaned untagged multi-arch layers. Flat alternation, no nested quantifiers -- a
          # nested-quantifier pattern tripped this action's own ReDoS safety heuristic on every
          # other repo this was set up on.
          delete-tags: ".*"
          exclude-tags: '^latest$|^main$|^[0-9]+\.[0-9]+$|^[0-9]+\.[0-9]+\.[0-9]+$'
          use-regex: true
          delete-untagged: true
          dry-run: false
          log-level: info
